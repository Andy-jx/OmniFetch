name: Build Windows Package

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r helper/requirements.txt
          pip install pyinstaller imageio-ffmpeg

      - name: Validate source files
        shell: pwsh
        run: |
          python -m py_compile helper/server.py helper/server_v2.py helper/server_v3.py helper/server_v4.py helper/server_v5.py helper/server_v6.py helper/server_v7.py helper/server_v8.py helper/server_v9.py helper/server_v10.py helper/server_v11.py helper/server_v12.py
          node --check extension/background_v11.js
          node --check extension/content_v11.js
          node --check extension/popup_v11.js
          node --check extension/stream_v11.js
          node --check extension/recorder.js
          Get-Content extension/manifest.json -Raw | ConvertFrom-Json | Out-Null

      - name: Run stabilization self tests
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'helper')
          import server_v12 as s
          import server_v10 as v10

          assert s.core.VERSION == '0.6.1'
          assert s.v11._quality_p(1920, 1080) == 1080
          assert s.v11._url_quality_hint('https://cdn.example/video_1280x720.mp4') == 720
          payload = {
              'media_url': 'https://video.example/master.m3u8',
              'media_candidates': [
                  {'url': 'https://video.example/master.m3u8', 'type': 'hls', 'score': 80},
                  {'url': 'https://cdn.example/v1080.mp4', 'type': 'mp4', 'score': 60, 'contentLength': 10000000},
              ],
              'playback_width': 1920,
              'playback_height': 1080,
              'playback_duration': 120,
          }
          items = s.v11._normalize_candidates(payload)
          assert len(items) == 2
          playlist = '#EXTM3U\n#EXT-X-TARGETDURATION:6\n#EXTINF:5.5,\na.mp4\n#EXTINF:6.0,\nb.mp4\n#EXT-X-ENDLIST\n'
          Path('test-local.m3u8').write_text(playlist, encoding='utf-8')
          assert abs(s._manifest_duration(Path('test-local.m3u8')) - 11.5) < 0.001
          init, segments, duration = v10._parse_media_playlist_v10('https://video.example/720/index.m3u8', playlist)
          assert init is None and len(segments) == 2 and abs(duration - 11.5) < 0.001
          print('OmniFetch 0.6.1 playback-safety self-tests passed')
          '@ | Set-Content -Encoding UTF8 selftest.py
          python selftest.py

      - name: Build helper EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name OmniFetchHelper --collect-all yt_dlp --paths helper helper/server_v12.py

      - name: Stage FFmpeg
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if (-not (Test-Path $ffmpeg)) { throw "FFmpeg binary not found: $ffmpeg" }
          Copy-Item $ffmpeg dist/ffmpeg.exe

      - name: Verify H264 AAC compatibility encoder
        shell: pwsh
        run: |
          & "$PWD\dist\ffmpeg.exe" -hide_banner -loglevel error -f lavfi -i "color=size=320x180:rate=25:duration=1" -f lavfi -i "anullsrc=r=48000:cl=stereo" -shortest -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac -t 1 "$PWD\dist\compat-test.mp4"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$PWD\dist\compat-test.mp4")) { throw "Bundled FFmpeg cannot encode H.264/AAC compatibility output" }
          Remove-Item "$PWD\dist\compat-test.mp4" -Force

      - name: Smoke test helper EXE
        shell: pwsh
        run: |
          $oldPath = $env:PATH
          $env:PATH = "$PWD\dist;$env:PATH"
          $proc = Start-Process -FilePath "$PWD\dist\OmniFetchHelper.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:17891/health" -TimeoutSec 2
                $caps = Invoke-RestMethod -Uri "http://127.0.0.1:17891/capabilities" -TimeoutSec 2
                if ($health.ok -eq $true -and $health.ffmpeg -eq $true -and $health.version -eq '0.6.1' -and $caps.quality_probe -eq $true -and $caps.concurrent_fragments -eq 8) {
                  $ok = $true
                  break
                }
              } catch {
              }
            }
            if (-not $ok) {
              throw "OmniFetchHelper.exe health/capabilities/FFmpeg check failed"
            }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
            $env:PATH = $oldPath
          }

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/OmniFetch | Out-Null
          Copy-Item -Recurse extension package/OmniFetch/extension
          Copy-Item dist/OmniFetchHelper.exe package/OmniFetch/OmniFetchHelper.exe
          Copy-Item dist/ffmpeg.exe package/OmniFetch/ffmpeg.exe
          Copy-Item run-helper-exe.bat package/OmniFetch/run-helper.bat
          Copy-Item start-helper-hidden.vbs package/OmniFetch/start-helper-hidden.vbs
          Copy-Item install-autostart.bat package/OmniFetch/install-autostart.bat
          Copy-Item uninstall-autostart.bat package/OmniFetch/uninstall-autostart.bat
          Copy-Item README.md package/OmniFetch/README.md
          if (Test-Path LICENSE) { Copy-Item LICENSE package/OmniFetch/LICENSE }
          Compress-Archive -Path package/OmniFetch/* -DestinationPath package/OmniFetch-Windows.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OmniFetch-Windows
          path: package/OmniFetch-Windows.zip
          if-no-files-found: error
