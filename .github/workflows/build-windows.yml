name: Build Windows Package

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r helper/requirements.txt
          pip install pyinstaller

      - name: Build helper EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name OmniFetchHelper --collect-all yt_dlp helper/server.py

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/OmniFetch | Out-Null
          Copy-Item -Recurse extension package/OmniFetch/extension
          Copy-Item dist/OmniFetchHelper.exe package/OmniFetch/OmniFetchHelper.exe
          Copy-Item run-helper-exe.bat package/OmniFetch/run-helper.bat
          Copy-Item README.md package/OmniFetch/README.md
          if (Test-Path LICENSE) { Copy-Item LICENSE package/OmniFetch/LICENSE }
          Compress-Archive -Path package/OmniFetch/* -DestinationPath package/OmniFetch-Windows.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OmniFetch-Windows
          path: package/OmniFetch-Windows.zip
          if-no-files-found: error
