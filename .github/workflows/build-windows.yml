name: Build Windows Package

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r helper/requirements.txt
          pip install pyinstaller imageio-ffmpeg

      - name: Validate source files
        shell: pwsh
        run: |
          python -m py_compile helper/server.py helper/server_v2.py helper/server_v3.py helper/server_v4.py helper/server_v5.py
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/stream.js
          node --check extension/recorder.js
          Get-Content extension/manifest.json -Raw | ConvertFrom-Json | Out-Null

      - name: Build helper EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name OmniFetchHelper --collect-all yt_dlp --paths helper helper/server_v5.py

      - name: Stage FFmpeg
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          if (-not (Test-Path $ffmpeg)) { throw "FFmpeg binary not found: $ffmpeg" }
          Copy-Item $ffmpeg dist/ffmpeg.exe

      - name: Smoke test helper EXE
        shell: pwsh
        run: |
          $oldPath = $env:PATH
          $env:PATH = "$PWD\dist;$env:PATH"
          $proc = Start-Process -FilePath "$PWD\dist\OmniFetchHelper.exe" -PassThru
          $ok = $false
          try {
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:17891/health" -TimeoutSec 2
                $caps = Invoke-RestMethod -Uri "http://127.0.0.1:17891/capabilities" -TimeoutSec 2
                if ($health.ok -eq $true -and $health.ffmpeg -eq $true -and $health.version -eq '0.5.5' -and $caps.quality_probe -eq $true -and $caps.concurrent_fragments -eq 8) {
                  $ok = $true
                  break
                }
              } catch {
              }
            }
            if (-not $ok) {
              throw "OmniFetchHelper.exe health/capabilities/FFmpeg check failed"
            }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
            $env:PATH = $oldPath
          }

      - name: Assemble package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/OmniFetch | Out-Null
          Copy-Item -Recurse extension package/OmniFetch/extension
          Copy-Item dist/OmniFetchHelper.exe package/OmniFetch/OmniFetchHelper.exe
          Copy-Item dist/ffmpeg.exe package/OmniFetch/ffmpeg.exe
          Copy-Item run-helper-exe.bat package/OmniFetch/run-helper.bat
          Copy-Item start-helper-hidden.vbs package/OmniFetch/start-helper-hidden.vbs
          Copy-Item install-autostart.bat package/OmniFetch/install-autostart.bat
          Copy-Item uninstall-autostart.bat package/OmniFetch/uninstall-autostart.bat
          Copy-Item README.md package/OmniFetch/README.md
          if (Test-Path LICENSE) { Copy-Item LICENSE package/OmniFetch/LICENSE }
          Compress-Archive -Path package/OmniFetch/* -DestinationPath package/OmniFetch-Windows.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OmniFetch-Windows
          path: package/OmniFetch-Windows.zip
          if-no-files-found: error
