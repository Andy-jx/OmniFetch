<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OmniFetch</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <h1>OmniFetch</h1>
        <p id="pageTitle" class="muted">正在读取当前页面…</p>
      </div>
      <span id="helperBadge" class="badge">助手检测中</span>
    </header>

    <section class="download-panel">
      <article class="download-card featured">
        <div>
          <div class="card-title">最高画质视频</div>
          <div id="videoHint" class="card-meta">播放后自动收集多条真实媒体候选，并优先最高可用画质</div>
        </div>
        <button id="downloadVideo" class="action-btn primary">下载视频</button>
      </article>

      <article class="download-card">
        <div>
          <div class="card-title">单独音频</div>
          <div id="audioHint" class="card-meta">自动选择已识别到的最佳音频轨</div>
        </div>
        <button id="downloadAudio" class="action-btn">下载音频</button>
      </article>
    </section>

    <section class="tools-row">
      <button id="refresh" class="btn">重新检测</button>
      <button id="recordMode" class="btn warning">录制兜底</button>
      <button id="clear" class="btn">清空识别</button>
    </section>

    <section class="status-box">
      <div id="statusText">播放视频 1–3 秒后再下载，识别更稳定。</div>
      <div id="captureSummary" class="capture-summary">等待媒体请求…</div>
    </section>

    <footer>
      v0.6.0 会先使用浏览器真实播放地址，自动换源并校验最终文件；M4S / TS 小分片、明显广告和低价值重复资源默认隐藏。
    </footer>
  </main>
  <script src="popup_v11.js"></script>
</body>
</html>
